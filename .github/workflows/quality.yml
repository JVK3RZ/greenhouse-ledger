name: Quality gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run quality gate
        run: npm test
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/ghl-browser" --no-save --ignore-scripts playwright@1.62.1
      - name: Run onboarding browser tests with installed Chrome
        env:
          GHL_BROWSER_MODULES: ${{ runner.temp }}/ghl-browser/node_modules
          ONBOARDING_SCREENSHOT: ${{ runner.temp }}/onboarding-mobile.png
        run: |
          export GHL_CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$GHL_CHROMIUM_PATH"
          node scripts/test-onboarding-browser.mjs
      - name: Upload onboarding screenshot
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: onboarding-browser-preview
          path: ${{ runner.temp }}/onboarding-mobile.png
          retention-days: 7
